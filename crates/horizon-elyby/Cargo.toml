[package]
name = "horizon-elyby"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Ely.by's Yggdrasil-compatible authserver, the client the launcher and the game share (docs/elyby-account.md)"

[features]
